<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TÜRKOD Referans</title>
  <link rel="icon" type="image/png" href="../türkod_arkaplansız.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #111118;
      --bg3: #18181f;
      --bg4: #1e1e28;
      --tx: #e8e8f0;
      --tx2: #8888a0;
      --tx3: #555568;
      --red: #e53e3e;
      --red-dim: rgba(229,62,62,0.12);
      --red-glow: rgba(229,62,62,0.25);
      --bd: #222230;
      --gn: #4ade80;
      --cy: #22d3ee;
      --pk: #f472b6;
      --yl: #facc15;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.6;
    }

    /* HEADER */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--bd);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--tx);
    }
    .header-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--red) 0%, #b91c1c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .header-logo-text {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .search-wrap {
      position: relative;
      width: 320px;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background: var(--bg3);
      border: 1px solid var(--bd);
      border-radius: 10px;
      color: var(--tx);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .search-wrap input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-dim);
    }
    .search-wrap input::placeholder { color: var(--tx3); }
    .search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }
    .header-links {
      display: flex;
      gap: 8px;
    }
    .header-link {
      padding: 8px 14px;
      background: var(--bg3);
      border: 1px solid var(--bd);
      border-radius: 8px;
      color: var(--tx2);
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
      font-weight: 500;
    }
    .header-link:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* LAYOUT */
    .layout {
      display: flex;
      margin-top: 60px;
      min-height: calc(100vh - 60px);
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      position: fixed;
      top: 60px;
      left: 0;
      bottom: 0;
      background: var(--bg2);
      border-right: 1px solid var(--bd);
      overflow-y: auto;
      padding: 20px 0;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 2px; }
    .sidebar-cat {
      padding: 8px 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--tx3);
      margin-top: 12px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--tx2);
      text-decoration: none;
      font-size: 13px;
      transition: all 0.15s;
      border-left: 2px solid transparent;
    }
    .sidebar-link:hover {
      background: var(--bg3);
      color: var(--tx);
      border-left-color: var(--red);
    }
    .sidebar-link .badge {
      margin-left: auto;
      background: var(--bg4);
      color: var(--tx3);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      flex: 1;
      padding: 32px 40px;
      max-width: 1000px;
    }

    /* SECTION */
    .section {
      margin-bottom: 56px;
    }
    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--red-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* CARD */
    .card {
      background: var(--bg2);
      border: 1px solid var(--bd);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: var(--red);
      box-shadow: 0 4px 20px rgba(229,62,62,0.08);
    }
    .card-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .card-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }
    .card-header .tags {
      display: flex;
      gap: 6px;
    }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-red { background: var(--red-dim); color: var(--red); }
    .tag-gn { background: rgba(74,222,128,0.12); color: var(--gn); }
    .tag-cy { background: rgba(34,211,238,0.12); color: var(--cy); }
    .card-body {
      padding: 0 18px 16px;
      display: none;
    }
    .card.open .card-body { display: block; }
    .card-desc {
      font-size: 13px;
      color: var(--tx2);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .card-code {
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--tx);
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .card-code .kw { color: var(--pk); }
    .card-code .fn { color: var(--cy); }
    .card-code .str { color: var(--gn); }
    .card-code .cm { color: var(--tx3); }

    /* BACK TO TOP */
    .back-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(229,62,62,0.3);
      transition: all 0.2s;
      z-index: 50;
    }
    .back-top:hover { transform: translateY(-2px); }
    .back-top.show { display: flex; }

    /* MOBILE MENU */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--tx);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
        z-index: 90;
        width: 260px;
      }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 24px 16px; }
      .menu-toggle { display: block; }
      .search-wrap { width: 180px; }
      .header-links { display: none; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">&#9776;</button>
      <a href="/" class="header-logo">
        <div class="header-logo-icon">T</div>
        <span class="header-logo-text">TÜRKOD</span>
      </a>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Komut, anahtar kelime veya kategori ara..." oninput="filterCards(this.value)">
    </div>
    <div class="header-links">
      <a href="/" class="header-link">Ana Sayfa</a>
      <a href="/referans/" class="header-link active">Referans</a>
      <a href="/moduller/" class="header-link">Modüller</a>
      <a href="/deneme/" class="header-link">Canlı Deneme</a>
      <a href="/gelistirici/" class="header-link">Geliştirici</a>
      <a href="https://github.com/aelif7826-ai/T-rkod/releases/download/T%C3%BCrkod/Turkod.Studyosu.Installer.3.exe" class="header-link" style="background:var(--red);color:#fff;border-color:var(--red);font-weight:700;padding:8px 18px;">&#10515; Yükle</a>
    </div>
  </header>

  <div class="layout">
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar"></nav>

    <!-- MAIN -->
    <main class="main" id="main"></main>
  </div>

  <button class="back-top" id="backTop" onclick="window.scrollTo({top:0})">&#8593;</button>

  <script>
    const DATA = {
      "TÜRKOD Dil Temelleri": {
        "icon": "&#128214;",
        "items": {
          "Değişken Tanımlama": [
            { name: "değişken", desc: "Yeni bir değişken tanımlar.", code: 'değişken ad := "Ali"\ndeğişken yaş := 25\ndeğişken aktif := doğru', tags: ["temel"] },
            { name: "sabit", desc: "Değeri değiştirilemeyen sabit tanımlar.", code: 'sabit PI := 3.14159\nsabit MAX_UZUNLUK := 1024', tags: ["temel"] },
            { name: "tür", desc: "Bir değişkenin türünü döndürür.", code: 'yazdır(tür(10))      // tam sayı\nyazdır(tür("merhaba")) // metin\nyazdır(tür(3.14))     // ondalıklı', tags: ["tur"] },
            { name: "türAta", desc: "Değişkenin türünü zorunlu olarak belirtir.", code: 'değişken yaş : tam sayı = 25\ndeğişken ad : metin = "Ali"', tags: ["tur"] },
          ],
          "Koşullar": [
            { name: "eger...ise", desc: "Koşul doğru ise çalışır.", code: 'eger yaş >= 18 ise\n  yazdır("Reşitsiniz")\nson', tags: ["kontrol"] },
            { name: "değilse", desc: "Koşul yanlış ise çalışır.", code: 'eger yaş >= 18 ise\n  yazdır("Reşitsiniz")\ndeğilse\n  yazdır("Reşit değilsiniz")\nson', tags: ["kontrol"] },
            { name: "değilse eger", desc: "Çoklu koşul kontrolü.", code: 'eger puans >= 90 ise\n  harf := "AA"\ndeğilse eger puans >= 80 ise\n  harf := "BA"\ndeğilse\n  harf := "FF"\nson', tags: ["kontrol"] },

          "Döngüler": [
            { name: "döngü N kez", desc: "Belirtilen sayı kadar tekrar eder.", code: 'döngü 5 kez\n  yazdır("Merhaba")\nson', tags: ["dongu"] },
            { name: "için...içinde", desc: "Aralık üzerinden döngü.", code: 'için i içinde aralık(1, 10)\n  yazdır(i)\nson', tags: ["dongu"] },

            { name: "kırıl", desc: "Döngüyü erken bitirir.", code: 'için i içinde aralık(1, 100)\n  eger i == 10 ise kırıl\n  yazdır(i)\nson', tags: ["dongu"] },
            { name: "devam", desc: "Sıradaki döngü adımına geçer.", code: 'için i içinde aralık(1, 10)\n  eger i % 2 == 0 ise devam\n  yazdır(i)\nson', tags: ["dongu"] },

          "Fonksiyonlar": [
            { name: "fonksiyon", desc: "Yeni bir fonksiyon tanımlar.", code: 'fonksiyon topla(a, b)\n  dön a + b\nson\nyazdır(topla(3, 5)) // 8', tags: ["fonksiyon"] },

          "Veri Yapıları": [
            { name: "Liste", desc: "Sıralı koleksiyon tanımlar.", code: 'değişken meyveler := ["elma", "armut", "kavun"]\nmeyveler.ekle("portakal")\nyazdır(meyveler[0]) // elma', tags: ["veri"] },

            { name: "demo", desc: "Listeyi harf harf ayırır.", code: 'değişken harfler := "Merhaba".demo()\n// ["M", "e", "r", "h", "a", "b", "a"]', tags: ["veri"] },

            { name: "küçükHarf", desc: "Metni küçük harfe çevirir.", code: 'yazdır("MERHABA".küçükHarf()) // merhaba', tags: ["metin"] },

    // Build sidebar and main
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('main');
    let html = '';
    let mainHtml = '';
    let first = true;

    for (const [cat, data] of Object.entries(DATA)) {
      const catId = cat.replace(/[^a-zA-Z0-9]/g, '');
      const items = Object.values(data.items).flat();
      const catSlug = cat.replace(/[^a-zA-Z0-9]/g, '');

      sidebar.innerHTML += `<div class="sidebar-cat">${data.icon} ${cat}</div>`;
      for (const [subName, subItems] of Object.entries(data.items)) {
        const subId = catSlug + '-' + subName.replace(/[^a-zA-Z0-9]/g, '');
        sidebar.innerHTML += `<a href="#${subId}" class="sidebar-link">${subName} <span class="badge">${subItems.length}</span></a>`;
      }

      mainHtml += `<section class="section" id="${catSlug}">`;
      mainHtml += `<div class="section-title"><span class="icon">${data.icon}</span> ${cat}</div>`;

      for (const [subName, subItems] of Object.entries(data.items)) {
        const subId = catSlug + '-' + subName.replace(/[^a-zA-Z0-9]/g, '');
        mainHtml += `<div id="${subId}" style="margin-bottom:24px">`;
        mainHtml += `<h3 style="font-size:15px;color:var(--tx2);margin-bottom:12px;padding-left:4px">${subName}</h3>`;

        for (const item of subItems) {
          const tagHtml = item.tags.map(t => {
            let cls = 'tag-red';
            if (['web','sis'].includes(t)) cls = 'tag-cy';
            if (['cizim','muzik'].includes(t)) cls = 'tag-gn';
            return `<span class="tag ${cls}">${t}</span>`;
          }).join('');

          const codeHtml = item.code.split('\n').map(l => {
            l = l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            l = l.replace(/\b(degisken|sabit|fonksiyon|don|eger|degilse|son|icin|dongu|kez|SonsuzDogru|kiril|devam|dene|yakala|neden|ice_aktar|disa_aktar)\b/g, '<span class="kw">$1</span>');
            l = l.replace(/(\/\/.*)$/g, '<span class="cm">$1</span>');
            l = l.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
            l = l.replace(/\b(yazdir|iste|tur|tamSayiya|ondalikliya|metne|dogru|uzunluk|buyukHarf|kucukHarf|degistir|bol|birlestir|iceriyorMu|baslangic|bitis|kira|tekrarEt|harflerBuyukMu|harflerKucukMu|rakamMi|sayiyaDonustur|MutlakDeger|Ust|Kok|Yuvarla|YuvarlaAsagi|YuvarlaYukari|min|max|sinir|BasamakToplam|BasamakUzunluk|BasamakDigerleri|BasamakTerseDon|BasamakCarpim|BasamakIlk|BasamakSon|BasamakOrta|BasamakMukemmelMi|BasamakAsilMi|BasamakArmstrongMu|BasamakPalindromMu|BasamakArmstrongListesi|BasamakAsalCarpanlar|BasamakRakamlar|BasamakBasamakDegerleri|calistir|baslat|bekle|platform|surum|Rastgele|RastgeleSec|RastgeleTamSayi|RastgeleHarf|RastgeleMetin|RastgeleRenk|evetHayir|sayiIste|sifreIste|secimIste|renkIste|dosyaIste|klasorIste)\b/g, '<span class="fn">$1</span>');
            return l;
          }).join('\n');

          mainHtml += `<div class="card" onclick="this.classList.toggle('open')">`;
          mainHtml += `<div class="card-header"><h3>${item.name}</h3><div class="tags">${tagHtml}</div></div>`;
          mainHtml += `<div class="card-body"><div class="card-desc">${item.desc}</div><div class="card-code">${codeHtml}</div></div>`;
          mainHtml += `</div>`;
        }
        mainHtml += `</div>`;
      }
      mainHtml += `</section>`;
    }
    main.innerHTML = mainHtml;

    // Search
    function filterCards(q) {
      q = q.toLowerCase();
      document.querySelectorAll('.card').forEach(c => {
        const text = c.textContent.toLowerCase();
        c.style.display = text.includes(q) ? '' : 'none';
      });
    }

    // Back to top
    window.addEventListener('scroll', () => {
      document.getElementById('backTop').classList.toggle('show', window.scrollY > 400);
    });

    // "e" tuşu ile geliştirici sayfasına geçiş
    document.addEventListener('keydown', (e) => {
      if (e.key === 'e' && !e.ctrlKey && !e.altKey && !e.metaKey) {
        const hedef = document.activeElement;
        if (hedef.tagName !== 'INPUT' && hedef.tagName !== 'TEXTAREA' && !hedef.isContentEditable) {
          e.preventDefault();
          window.location.href = '/gelistirici/';
        }
      }
    });
  </script>
